[custom]
; ==================== 1. 过滤机场原始节点 ====================
rename_node=(?i)[\u200b-\u200d\ufeff]@
#exclude=(?i)冷门|重置|剩余|到期|官网|网址|倍率|高倍|x|X|订阅|广告|客户|免流|(\b|[^\d])(([2-9]\d*|1\d+)(\.\d+)?|1\.[1-9]\d*)(x|倍)


; ==================== 2. 策略组配置 ====================
; --- 自动测速组 ---
custom_proxy_group = ♻️ 香港自动`url-test`(?i)(hksar|hk|hong[\s_-]*kong|香港|🇭🇰)`https://www.gstatic.com/generate_204`600,,100
custom_proxy_group = ♻️ 台湾自动`url-test`(?i)(tw|taiwan|taipei|台湾|台北|🇹🇼)`https://www.gstatic.com/generate_204`600,,100
custom_proxy_group = ♻️ 日本自动`url-test`(?i)(jp|japan|tokyo|日本|🇯🇵)`https://www.gstatic.com/generate_204`600,,100
custom_proxy_group = ♻️ 狮城自动`url-test`(?i)(sg|singapore|sin[\s_-]*gapore|新加坡|坡|🇸🇬)`https://www.gstatic.com/generate_204`600,,100
custom_proxy_group = ♻️ 美国自动`url-test`(?i)(us|usa|america|united[\s_-]*states|美国|🇺🇸)`https://www.gstatic.com/generate_204`600,,100
custom_proxy_group = ♻️ 其他自动`url-test`^(?!(.*(?i)(hksar|hk|hong[\s_-]*kong|香港|🇭🇰|tw|taiwan|taipei|台湾|台北|🇹🇼|jp|japan|tokyo|日本|🇯🇵|sg|singapore|sin[\s_-]*gapore|新加坡|坡|🇸🇬|us|usa|america|united[\s_-]*states|美国|🇺🇸))).*$`https://www.gstatic.com/generate_204`600,,100

custom_proxy_group = ✈️ 全球手动`select`.*

; --- 区域手动选择组（已修复引用的自动组名称，补全 ♻️ 图标） ---
custom_proxy_group = 🇭🇰 香港策略`select`[]♻️️ 香港自动`(?i).*(hksar|hk|hong[\s_-]*kong|香港|🇭🇰)
custom_proxy_group = 🇹🇼 台湾策略`select`[]♻️ 台湾自动`(?i).*(tw|taiwan|taipei|台湾|台北|🇹🇼)
custom_proxy_group = 🇯🇵 日本策略`select`[]♻️ 日本自动`(?i).*(jp|japan|tokyo|日本|🇯🇵)
custom_proxy_group = 🇸🇬 狮城策略`select`[]♻️ 狮城自动`(?i).*(sg|singapore|sin[\s_-]*gapore|新加坡|坡|🇸🇬)
custom_proxy_group = 🇺🇸 美国策略`select`[]♻️ 美国自动`(?i).*(us|usa|america|united[\s_-]*states|美国|🇺🇸)
custom_proxy_group = 🌏 其他策略`select`[]♻️ 其他自动`^(?!(.*(?i)(hksar|hk|hong[\s_-]*kong|香港|🇭🇰|tw|taiwan|taipei|台湾|台北|🇹🇼|jp|japan|tokyo|日本|🇯🇵|sg|singapore|sin[\s_-]*gapore|新加坡|坡|🇸🇬|us|usa|america|united[\s_-]*states|美国|🇺🇸))).*$

; --- 故障转移组 ---
custom_proxy_group = 🔯 故障转移`fallback`[]香港策略`[]台湾策略`[]狮城策略`[]日本策略`[]美国策略`[]其他策略`https://www.google.com/generate_204`600,,100

; --- 核心业务分流策略组 ---
custom_proxy_group = 📲 即时通讯`select`[]故障转移`[]全球手动`[]香港策略`[]台湾策略`[]日本策略`[]狮城策略`[]美国策略`[]其他策略`[]DIRECT
custom_proxy_group = 🤖 社交平台`select`[]故障转移`[]全球手动`[]香港策略`[]台湾策略`[]日本策略`[]狮城策略`[]美国策略`[]其他策略`[]DIRECT`https://github.com/Koolson/Qure/raw/master/IconSet/Color/Twitter.png
custom_proxy_group = 🧚 人工智能`select`[]故障转移`[]美国策略`[]日本策略`[]台湾策略`[]狮城策略`[]香港策略`[]其他策略`[]全球手动`[]DIRECT
custom_proxy_group = 🎵 Spotify`select`[]DIRECT`[]故障转移`[]全球手动`[]香港策略`[]台湾策略`[]日本策略`[]狮城策略`[]美国策略`[]其他策略
custom_proxy_group = 🎬 EMBY`select`[]故障转移`[]香港策略`[]狮城策略`[]美国策略`[]其他策略
custom_proxy_group = 🌍 国际媒体`select`[]故障转移`[]全球手动`[]香港策略`[]台湾策略`[]日本策略`[]狮城策略`[]美国策略`[]其他策略`[]DIRECT
custom_proxy_group = 📢 谷歌服务`select`[]故障转移`[]全球手动`[]香港策略`[]台湾策略`[]日本策略`[]狮城策略`[]美国策略`[]其他策略`[]DIRECT
custom_proxy_group = Ⓜ️ 微软服务`select`[]DIRECT`[]故障转移`[]全球手动`[]香港策略`[]台湾策略`[]日本策略`[]狮城策略`[]美国策略`[]其他策略
custom_proxy_group = 🍎 苹果服务`select`[]DIRECT`[]故障转移`[]全球手动`[]香港策略`[]台湾策略`[]日本策略`[]狮城策略`[]美国策略`[]其他策略
custom_proxy_group = 🚀 国外流量`select`[]故障转移`[]全球手动`[]香港策略`[]台湾策略`[]日本策略`[]狮城策略`[]美国策略`[]其他策略`[]DIRECT
custom_proxy_group = 🎯 国内流量`select`[]DIRECT`[]故障转移`[]全球手动`[]香港策略`[]台湾策略`[]日本策略`[]狮城策略`[]美国策略`[]其他策略
custom_proxy_group = 🐟 漏网之鱼`select`[]DIRECT`[]故障转移`[]全球手动`[]香港策略`[]台湾策略`[]日本策略`[]狮城策略`[]美国策略`[]其他策略


; ==================== 3. 规则集 ====================
; 直连与私有
ruleset = DIRECT,https://raw.githubusercontent.com/666OS/rules/refs/heads/release/mihomo/Direct.txt,21600
ruleset = DIRECT,[]GEOSITE,private
ruleset = DIRECT,[]GEOSITE,google-cn
ruleset = DIRECT,https://raw.githubusercontent.com/666OS/rules/refs/heads/release/mihomo/Download.txt,21600

; 自定义代理
ruleset = DIRECT,clash-classic:https://raw.githubusercontent.com/j6y9c4t9/myclashrule/main/Provider_direct.yaml,21600
ruleset = 🚀 国外流量,clash-classic:https://raw.githubusercontent.com/j6y9c4t9/myclashrule/main/Provider_proxy.yaml,21600

; 即时通讯
ruleset = 📲 即时通讯,[]GEOSITE,category-communication

; Spotify
ruleset = 🎵 Spotify,[]GEOSITE,Spotify

; 社交平台
ruleset = 🤖 社交平台,[]GEOSITE,category-social-media-!cn

; 人工智能
ruleset = 🧚 人工智能,[]GEOSITE,category-ai-!cn

; 开发服务
ruleset = 🚀 国外流量,[]GEOSITE,category-dev

; EMBY 与流媒体（已修复 🎬 EMBYY 的拼写错误）
ruleset = 🎯 国内流量,https://raw.githubusercontent.com/666OS/rules/refs/heads/release/mihomo/XPTV.txt,21600
ruleset = 🎬 EMBY,https://raw.githubusercontent.com/666OS/rules/refs/heads/release/mihomo/Emby.txt,21600
ruleset = 🎬 EMBY,clash-classic:https://raw.githubusercontent.com/j6y9c4t9/myclashrule/main/Emby_proxy.yaml,21600
ruleset = 🌍 国际媒体,[]GEOSITE,category-media
ruleset = 🌍 国际媒体,[]GEOSITE,category-entertainment

; 谷歌、微软、苹果
ruleset = 📢 谷歌服务,[]GEOSITE,google
ruleset = Ⓜ️ 微软服务,[]GEOSITE,microsoft
ruleset = 🍎 苹果服务,[]GEOSITE,apple

; 国外域名兜底
ruleset = 🚀 国外流量,[]GEOSITE,geolocation-!cn

; 国内域名兜底
ruleset = DIRECT,[]GEOSITE,cn

; IP规则
ruleset = DIRECT,[]GEOIP,private,no-resolve
ruleset = 📲 即时通讯,[]GEOIP,telegram,no-resolve
ruleset = 🤖 社交平台,[]GEOIP,twitter,no-resolve
ruleset = 🤖 社交平台,[]GEOIP,facebook,no-resolve
ruleset = 📢 谷歌服务,[]GEOIP,google,no-resolve
ruleset = DIRECT,[]GEOIP,CN,no-resolve

ruleset = 🐟 漏网之鱼,[]FINAL

enable_rule_generator=true
overwrite_original_rules=true
